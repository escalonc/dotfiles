#cloud-config
# One-shot provisioning for the remote dev box (Ubuntu 24.04 LTS).
#
# SECURITY: the OP_SERVICE_ACCOUNT_TOKEN below is a secret. Do NOT commit a real
# token. Paste it into your provider's cloud-init / user-data field at create
# time (Hetzner: "Cloud config" box), keeping this file as the template.
#
# Flow: create the user → install `op` (so chezmoi's onepasswordRead works during
# the first apply) → chezmoi init --apply clones the (public) dotfiles over HTTPS
# and runs the run_onchange scripts, which install everything and pull the SSH key
# from 1Password.

users:
  - name: chris
    groups: [sudo]              # Ubuntu's sudo group
    shell: /bin/bash            # bootstrap chsh's this to zsh
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      - REPLACE_WITH_YOUR_LAPTOP_PUBLIC_KEY

write_files:
  - path: /home/chris/.op-token
    owner: chris:chris
    permissions: '0600'
    content: |
      REPLACE_WITH_OP_SERVICE_ACCOUNT_TOKEN

package_update: true
packages: [curl, git, gnupg, jq, ca-certificates]

runcmd:
  # 1Password CLI — installed here so template secret-reads work on the first apply.
  - curl -fsSL https://downloads.1password.com/linux/keys/1password.asc | gpg --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg
  - |
    echo "deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main" > /etc/apt/sources.list.d/1password.list
  - mkdir -p /etc/debsig/policies/AC2D62742012EA22/
  - curl -fsSL https://downloads.1password.com/linux/debian/debsig/1password.pol > /etc/debsig/policies/AC2D62742012EA22/1password.pol
  - mkdir -p /usr/share/debsig/keyrings/AC2D62742012EA22
  - curl -fsSL https://downloads.1password.com/linux/keys/1password.asc | gpg --dearmor --output /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y 1password-cli
  # Install chezmoi and apply the dotfiles as the user, then shred the token.
  - >-
    sudo -u chris -H bash -lc
    'export OP_SERVICE_ACCOUNT_TOKEN="$(cat ~/.op-token)";
     sh -c "$(curl -fsLS get.chezmoi.io)" -- init --apply
     https://github.com/escalonc/dotfiles.git --branch server-support;
     shred -u ~/.op-token'
