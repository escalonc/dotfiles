[general]
default_session_mode = "terminal"

[agents]

[agents.third_party]
should_render_cli_agent_toolbar = true

[agents.warp_agent]
is_any_ai_enabled = false

[agents.warp_agent.other]
show_agent_notifications = true
show_conversation_history = true

[appearance]

[appearance.vertical_tabs]
enabled = false

# Mirrors ~/.config/ghostty/config so both terminals look the same.
# Custom themes are referenced as a table: { custom = { name, path } }, where
# path is relative to ~/.warp/themes/. A bare string here fails to parse.
[appearance.themes]
system_theme = false
theme = { custom = { name = "Monokai Pro Spectrum", path = "monokai_pro_spectrum.yaml" } }

[appearance.text]
font_name = "JetBrainsMono Nerd Font"
font_size = 16.0
font_weight = "medium"
line_height_ratio = 1.3
ligature_rendering_enabled = true
use_thin_strokes = "never"
enforce_minimum_contrast = "never"
match_ai_font = true
match_notebook_to_monospace_font_size = true
notebook_font_size = 14.0

[appearance.cursor]
cursor_display_type = "bar"
cursor_blink = "enabled"

[code]

[code.editor]
show_code_review_button = true
show_project_explorer = true
show_global_search = true

[warp_drive]
enabled = true

[terminal]
copy_on_select = true

[terminal.input]
input_box_type_setting = "classic"
honor_ps1 = true

[privacy]
telemetry_enabled = false
crash_reporting_enabled = false
