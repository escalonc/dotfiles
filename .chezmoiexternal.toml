# Shell stack fetched and refreshed BY CHEZMOI (replaces the old 20-shell clone
# script). On `apply`, anything older than refreshPeriod is re-downloaded — so the
# stack stays current with ZERO interaction: no `omz update` nag, ever (the
# self-updater is `mode disabled` in dot_zshrc; with no .git in the extracted
# archive it couldn't run anyway).
#
# `exact = true` makes chezmoi prune files that aren't in the archive (upstream
# deletions propagate; OMZ's regenerable cache/ churn is harmless). GitHub
# tarballs wrap everything in a `<repo>-master/` dir — stripComponents drops it.

[".oh-my-zsh"]
    type = "archive"
    url = "https://github.com/ohmyzsh/ohmyzsh/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".oh-my-zsh/custom/themes/powerlevel10k"]
    type = "archive"
    url = "https://github.com/romkatv/powerlevel10k/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
