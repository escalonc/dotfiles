# ~/.tmux.conf — managed by chezmoi.
# Plugins (TPM + the ones below) are pre-fetched via .chezmoiexternal.toml, so a
# fresh machine needs no `prefix + I` — they load on first start. Reload after
# edits with `prefix + r`.

# ── General ──────────────────────────────────────────────────────────────────
set -g prefix C-a                  # remap prefix from C-b to C-a
unbind C-b
bind C-a send-prefix               # press C-a twice to send a literal C-a

set -g mouse on                    # click/scroll/select/resize with the mouse
set -g base-index 1                # number windows from 1
setw -g pane-base-index 1          # number panes from 1
set -g renumber-windows on         # keep window numbers gap-free after closing
set -g history-limit 50000         # generous scrollback
set -sg escape-time 0              # no delay for ESC (snappy in vim)
set -g focus-events on             # let vim/editors react to focus
set -g set-clipboard on            # OSC 52 clipboard integration

# True color + italics (modern terminals). Adjust if your $TERM differs.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:RGB,xterm-256color:RGB,alacritty:RGB"

# ── Key bindings ─────────────────────────────────────────────────────────────
# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Splits that keep the current working directory; intuitive | and - keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing, repeatable (hold prefix, tap H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching, repeatable
bind -r n next-window
bind -r p previous-window

# ── Copy mode (vi keys) ──────────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
# Drag-select with the mouse copies, then stays put (no jump to bottom)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# ── Plugins (TPM) ────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session persistence: save automatically and restore on tmux start.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'   # minutes

# ── Status bar — synced with Powerlevel10k ──────────────────────────────────
# Hand-built (no theme plugin) to match the p10k prompt exactly: rainbow palette
# (8-bit colours 0-7), rounded powerline caps  /  ( / ), and the
# signature ░▒▓ … ▓▒░ gradient fade at the outer edges. Powerline transitions
# colour the separator glyph fg=<current seg bg>, bg=<next seg bg> so adjacent
# segments blend seamlessly — same trick p10k uses.
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=colour250"
set -g message-style "fg=colour232,bg=colour7"
set -g pane-active-border-style "fg=colour4"
set -g pane-border-style "fg=colour8"

# Left: ░▒▓ fade →  os_icon (apple, fg232/bg7 white) →  session (fg254/bg4 blue)
set -g status-left-length 100
set -g status-left "#[fg=colour7,bg=default]░▒▓#[fg=colour232,bg=colour7,bold]  #[fg=colour7,bg=colour4]#[fg=colour254,bg=colour4,bold] #S #[fg=colour4,bg=default] "

# Right: mirror —  date (fg254/bg4 blue) →  clock (fg0/bg7 white) → ▓▒░ fade
set -g status-right-length 100
set -g status-right "#[fg=colour4,bg=default]#[fg=colour254,bg=colour4,bold] %b %d #[fg=colour7,bg=colour4]#[fg=colour0,bg=colour7,bold] %H:%M #[fg=colour7,bg=default]▓▒░"

# Windows: active = blue rounded "pill" like the p10k dir segment; inactive dim.
set -g window-status-separator ""
set -g window-status-format "#[fg=colour250,bg=default] #I:#W "
set -g window-status-current-format "#[fg=colour4,bg=default]#[fg=colour254,bg=colour4,bold] #I:#W #[fg=colour4,bg=default]"

# Keep this line last: initializes TPM and sources every plugin above.
run '~/.tmux/plugins/tpm/tpm'
