# ~/.tmux.conf (chezmoi). Plugins pre-fetched via .chezmoiexternal.toml; reload edits with `prefix + r`.

# ── General ──────────────────────────────────────────────────────────────────
set -g prefix C-a                  # remap prefix from C-b to C-a
unbind C-b
bind C-a send-prefix               # press C-a twice to send a literal C-a

set -g mouse on                    # click/scroll/select/resize with the mouse
set -g base-index 1                # number windows from 1
setw -g pane-base-index 1          # number panes from 1
set -g renumber-windows on         # keep window numbers gap-free after closing
set -g set-clipboard on            # OSC 52 clipboard integration
# tmux >= 3.7 defaults escape-time to 10, which stops tmux-sensible's
# 500->0 rewrite from firing; keep 0 (instant ESC in vim) explicitly.
set -sg escape-time 0
# history-limit 50000, focus-events on come from tmux-sensible.
# (status-interval is set to 1 in the status-bar section, so sensible's 5 never applies.)

# True color + italics (modern terminals). Adjust if your $TERM differs.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:RGB,xterm-256color:RGB,alacritty:RGB"

# ── Key bindings ─────────────────────────────────────────────────────────────
# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Splits that keep the current working directory; intuitive | and - keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing, repeatable (hold prefix, tap H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching, repeatable
bind -r n next-window
bind -r p previous-window

# lazygit in a floating popup; -d is essential, else it opens in the session start dir
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# ── Copy mode (vi keys) ──────────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
# Drag-select with the mouse copies, then stays put (no jump to bottom)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# ── Plugins (TPM) ────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session persistence: save automatically (every 15 min, the continuum
# default) and restore on tmux start.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# yank runs after this file (tpm is last) and would rebind MouseDragEnd1Pane to
# copy-and-cancel, undoing our no-clear drag binding; OSC 52 (set-clipboard on)
# already reaches the system clipboard without yank's mouse handling.
set -g @yank_with_mouse off

# ── Status bar — "Ink" ──────────────────────────────────────────────────────
# Pure typography on a transparent bar. ANSI-16 slots only (no hexes), so the
# bar restyles itself with the terminal theme: session = colour4 "place"
# (orange in Monokai Pro Spectrum, blue in Catppuccin/Tokyo Night) · active
# window = colour4 index + bold colour7 name · flags = yellow (Z zoom,
# ! activity) · prefix = purple ^a · copy mode = cyan · clock = dim.
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 1                    # clock shows seconds
set -g status-style "bg=default,fg=colour8"
set -g message-style "fg=colour7,bg=colour0"
set -g mode-style "fg=colour0,bg=colour6"   # copy-mode selection: cyan = copy
set -g pane-active-border-style "fg=colour8"
set -g pane-border-style "fg=colour0"
set -g clock-mode-colour "colour4"

# Left: session name (place accent) · dim separator
set -g status-left-length 100
set -g status-left "#[fg=colour4,bold]#S#[fg=colour8,nobold] ·  "

# Windows: inactive dim; active = accent index + bold white name; yellow flags.
# Activity ! needs monitor-activity; explicit fg in the formats replaces the
# default reverse-video activity style, so neutralize it.
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style none
set -g window-status-separator "  "
set -g window-status-format "#{?window_activity_flag,#[fg=colour3],#[fg=colour8]}#I #W#{?window_activity_flag,!,}"
set -g window-status-current-format "#[fg=colour4,bold]#I #[fg=colour7]#W#{?window_zoomed_flag,#[fg=colour3] Z,}"

# Right: purple ^a while prefix is armed · cyan "copy" in copy mode · dim clock
set -g status-right-length 100
set -g status-right "#{?client_prefix,#[fg=colour5]#[bold]^a#[default]  ,}#{?pane_in_mode,#[fg=colour6]copy#[default]  ,}#[fg=colour8]%H:%M:%S"

# Keep this line last: initializes TPM and sources every plugin above.
run '~/.tmux/plugins/tpm/tpm'
