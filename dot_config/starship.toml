# ═══════════════════════════════════════════════════════════════════════════
# "Ink" — Starship × Monokai Pro Spectrum
# Pure typography: no pills, no backgrounds. Hierarchy from weight + dimming.
#   place = orange · ok/clean = green · error/conflict = red · dirty git = yellow
#   duration & vi command mode = purple · detail/meta = grays
#
# Port of the former p10k-ink theme (git history: tag pre-starship).
# Branch icon is the Powerline glyph  — needs a Nerd Font (or Ghostty,
# which bundles the symbols as a built-in fallback).
# ═══════════════════════════════════════════════════════════════════════════

# Blank line between prompts; dir + git on top, prompt char below
add_newline = true
format = '$directory$git_branch$git_status$line_break$character'
right_format = '$status$cmd_duration$jobs$username$hostname$time'

palette = 'ink'

[palettes.ink]
muted = '#8b888f'    # secondary text
faint = '#69676c'    # timestamps, meta
orange = '#fd9353'   # place (dir anchor)
red = '#fc618d'      # error / conflict
green = '#7bd88f'    # ok / clean
yellow = '#fce566'   # dirty git
purple = '#948ae3'   # duration, vi command mode

# ── Directory: bold orange place marker ──────────────────────────────────────
# (p10k dimmed the parent dirs and highlighted only the leaf; starship can't
# style path elements individually, so the whole displayed path is the anchor.)
[directory]
style = 'bold orange'
truncation_length = 3
truncation_symbol = '…/'
read_only = ''       # no Nerd Font padlock
format = '[$path]($style) '

# ── Git: green branch, yellow modified counts, red conflicts ────────────────
[git_branch]
symbol = ' '
style = 'green'
truncation_length = 32
truncation_symbol = '…'
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
format = '([$ahead_behind$stashed$conflicted$staged$modified$renamed$deleted$untracked]($style))'
style = ''
ahead = '[⇡$count](green) '
behind = '[⇣$count](green) '
diverged = '[⇡$ahead_count⇣$behind_count](green) '
stashed = '[*$count](green) '
conflicted = '[~$count](bold red) '
staged = '[+$count](bold yellow) '
modified = '[!$count](bold yellow) '
renamed = '[»$count](bold yellow) '
deleted = '[✘$count](bold yellow) '
untracked = '[?$count](bold yellow) '

# ── Prompt char: ❯ inherits last exit code; ❮ purple in vi command mode ─────
[character]
success_symbol = '[❯](green)'
error_symbol = '[❯](red)'
vimcmd_symbol = '[❮](purple)'
vimcmd_replace_symbol = '[❮](purple)'
vimcmd_replace_one_symbol = '[❮](purple)'
vimcmd_visual_symbol = '[❮](purple)'

# ── Right side: ✗ 1 only on error, purple duration, dim timestamp ───────────
[status]
disabled = false
format = '[✗ $status]($style) '
style = 'bold red'

# Duration of the last command, shown once it finishes (only if it took >3s)
[cmd_duration]
min_time = 3000
format = '[$duration](bold purple) '

# Background jobs: yellow &N
[jobs]
symbol = '&'
symbol_threshold = 1
number_threshold = 1
format = '[$symbol$number](yellow) '

# user@host: hidden locally, muted over ssh, red when root
[username]
show_always = false
style_user = 'muted'
style_root = 'bold red'
format = '[$user]($style)[@](muted)'

[hostname]
ssh_only = true
style = 'muted'
format = '[$hostname]($style) '

[time]
disabled = false
time_format = '%I:%M:%S %p'
style = 'faint'
format = '[$time]($style)'
